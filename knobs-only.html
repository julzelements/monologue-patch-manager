<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korg Monologue Knobs</title>
    <style>
      body {
        margin: 0;
        background: #222;
        font-family: sans-serif;
      }

      #synth-container {
        position: relative;
        width: 900px;
        height: 400px;
        margin: 20px auto;
        background: #f38989;
        border: 2px solid #000000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      .knob {
        border-radius: 50%;
        position: absolute;
        width: 35px;
        height: 35px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .knob:hover {
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .knob-0-1 {
        background-color: #4ecdc4;
      }

      .bg-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(40, 40, 40, 0.9);
        border: 2px solid #00ffff;
        border-radius: 6px;
        color: #00ffff;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.2s ease;
      }

      .bg-toggle:hover {
        background: rgba(60, 60, 60, 0.9);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      }

      .bg-toggle.off {
        border-color: #666;
        color: #666;
      }
    </style>
  </head>
  <body>
    <button class="bg-toggle" id="bg-toggle" onclick="toggleBackground()">BG ON</button>

    <div
      id="synth-container"
      style="background-image: url('knobs only.svg'); background-size: 100% 100%; background-repeat: no-repeat"
    >
      <div class="knob knob-0-1"></div>
    </div>

    <script>
      // Transform function to convert SVG circle coordinates to CSS positioning
      function transformCirclePosition(svgX, svgY, radius = 3.5) {
        const SVG_WIDTH = 176;
        const SVG_HEIGHT = 78;
        const CONTAINER_WIDTH = 900;
        const CONTAINER_HEIGHT = 400;

        const containerX = (svgX / SVG_WIDTH) * CONTAINER_WIDTH;
        const containerY = (svgY / SVG_HEIGHT) * CONTAINER_HEIGHT;
        const cssRadius = (radius / SVG_WIDTH) * CONTAINER_WIDTH;

        return {
          left: Math.round(containerX - cssRadius),
          top: Math.round(containerY - cssRadius),
          width: Math.round(cssRadius * 2),
          height: Math.round(cssRadius * 2),
        };
      }

      // Position knobs using coordinates from knobs.json
      const knobs = [{ element: document.querySelector(".knob-0-1"), x: 17.3, y: 32.8 }];

      knobs.forEach(({ element, x, y }) => {
        const position = transformCirclePosition(x, y, 3.5);
        element.style.left = position.left + "px";
        element.style.top = position.top + "px";
      });

      // Background toggle functionality
      function toggleBackground() {
        const container = document.getElementById("synth-container");
        const button = document.getElementById("bg-toggle");
        const currentBg = container.style.backgroundImage;

        if (currentBg && currentBg !== "none") {
          container.style.backgroundImage = "none";
          button.textContent = "BG OFF";
          button.classList.add("off");
        } else {
          container.style.backgroundImage = "url('knobs only.svg')";
          button.textContent = "BG ON";
          button.classList.remove("off");
        }
      }
    </script>
  </body>
</html>
