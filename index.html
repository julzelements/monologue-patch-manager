<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korg Monologue Prototype Layout</title>
    <style>
      body {
        margin: 0;
        background: #222;
        font-family: sans-serif;
      }

      /* Global container controls absolute coordinate system */
      #synth-container {
        position: relative;
        width: 900px;
        height: 400px;
        margin: 20px auto;
        background: #f38989;
        border: 2px solid #000000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      /* Background toggle button */
      .bg-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(40, 40, 40, 0.9);
        border: 2px solid #00ffff;
        border-radius: 6px;
        color: #00ffff;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.2s ease;
      }

      .bg-toggle:hover {
        background: rgba(60, 60, 60, 0.9);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      }

      .bg-toggle.off {
        border-color: #666;
        color: #666;
      }

      .container {
        position: relative;
        height: 60px;
        width: 700px;
        border: 1px solid #ccc;
      }

      .divider {
        position: absolute;
        width: 1px;
        height: 140px;
        background-color: #78e484;
        top: 50px;
        left: 450px;
      }

      .ruler {
        position: absolute;
        width: 20px;
        height: 20px;
        top: 282px;
        left: 246px;
        background-color: #78e484;
      }

      .lcd-screen {
        position: absolute;
        width: 71px;
        height: 41px;
        top: 192px;
        left: 635px;
        border: 1px solid #333;
        background-color: #333;
        border-radius: 2px;
      }

      .sequencer-container {
        display: grid;
        grid-template-columns: repeat(16, 32px);
        gap: 5.2px;
        position: absolute;
        left: 246px;
        top: 282px;
      }

      .edit-menu-container {
        display: grid;
        grid-template-columns: repeat(3, 32px);
        gap: 5px;
        position: absolute;
        left: 320px;
        top: 206px;
      }

      .sequencer-menu-container {
        display: grid;
        grid-template-columns: repeat(4, 32px);
        gap: 5px;
        position: absolute;
        left: 469px;
        top: 206px;
      }

      .menu-button {
        height: 15px;
        width: 32px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
        border-radius: 2px;
      }

      .square {
        width: 32px;
        height: 30px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
      }

      .key-trig-hold {
        position: absolute;
        top: 125px;
        left: 803px;
        width: 32px;
        height: 28px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
      }

      .u-path {
        stroke: blue;
        stroke-width: 1;
        fill: none;
      }

      .knob {
        width: 35px;
        height: 35px;
        position: absolute;
        top: 100px;
        left: 100px;
      }

      .knob-dial {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #444;
        border: 2px solid #222; /* scaled down border */
        position: relative;
        display: flex;
        justify-content: center;
        transform-origin: center center;
        align-items: center;
        touch-action: none; /* ensures smooth dragging */
      }

      .knob-pointer {
        width: 3px;
        height: 15px;
        background: #ffcc00;
        border-radius: 2px;
        position: absolute;
        top: 3px;
        left: 50%;
        transform: translateX(-50%);
      }

      .knob-label {
        position: absolute;
        color: #fff;
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        text-align: center;
        white-space: nowrap;
      }

      .knob-label {
        position: absolute;
        color: #fff;
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        text-align: center;
        white-space: nowrap;
      }

      .toggle-container {
        position: absolute;
        color: #fff;
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        text-align: center;
        white-space: nowrap;
      }

      .toggle-container {
        border: 1px solid black;
        position: absolute;
        top: 50px; /* set vertical position */
        left: 50px; /* set horizontal position */
        width: 52px;
        height: 15px;
        background: #ddd;
        border-radius: 21px;
        padding: 2px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .toggle-zone {
        flex: 1;
        height: 100%;
        cursor: pointer;
        z-index: 1;
      }

      .toggle-knob {
        border: 1px solid black;
        position: absolute;
        top: 2px;
        left: 2px;
        width: 15px;
        height: 17px;
        background: white;
        border-radius: 50%;
        transition: transform 0.15s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        pointer-events: none;
        z-index: 2;
      }

      .pos-0 {
        transform: translateX(0);
      }
      .pos-1 {
        transform: translateX(17px);
      }
      .pos-2 {
        transform: translateX(34px);
      }

      .vertical-toggle {
        border: 1px solid black;
        position: absolute;
        top: 50px; /* set vertical position */
        left: 150px; /* set horizontal position */
        width: 14px;
        height: 46px;
        background: #ddd;
        border-radius: 21px;
        padding: 2px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      .vertical-zone {
        flex: 1;
        width: 100%;
        cursor: pointer;
        z-index: 1;
      }

      .vertical-knob {
        border: 1px solid black;
        position: absolute;
        top: 3px;
        left: 3px;
        width: 11px;
        height: 11px;
        background: white;
        border-radius: 50%;
        transition: transform 0.15s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        pointer-events: none;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .vertical-knob::after {
        content: "";
        width: 8px;
        height: 8px;
        background: #ddd;
        border-radius: 50%;
        border: 1px solid #999;
      }
      .v-pos-0 {
        transform: translateY(0px);
      }
      .v-pos-1 {
        transform: translateY(17px);
      }
      .v-pos-2 {
        transform: translateY(31px);
      }
    </style>
  </head>

  <body>

      <div class="knob" id="vco1Shape">

      </div>
      <div class="knob" id="vco2Shape">

      </div>
      <div class="knob" id="vco2Mixer">
        <div class="knob-dial">

      </div>
      <div class="knob" id="resonance">

    <script>
      // Load knobs configuration
      let knobsConfig = {};
      let togglesConfig = {};

      async function loadKnobsConfig() {
        try {
          const response = await fetch("knobs.json");
          knobsConfig = await response.json();
          positionKnobs();
        } catch (error) {
          console.error("Error loading knobs.json:", error);
        }
      }

      async function loadTogglesConfig() {
        try {
          const response = await fetch("toggles.json");
          togglesConfig = await response.json();
          positionToggles();
        } catch (error) {
          console.error("Error loading toggles.json:", error);
        }
      }

      function positionToggles() {
        // Position all toggles based on JSON config
        Object.keys(togglesConfig).forEach((toggleKey) => {
          const toggleElement = document.getElementById(toggleKey);
          const labelElement = document.getElementById(`${toggleKey}-label`);

          if (toggleElement && togglesConfig[toggleKey]) {
            toggleElement.style.top = togglesConfig[toggleKey].top + "px";
            toggleElement.style.left = togglesConfig[toggleKey].left + "px";

            if (labelElement && togglesConfig[toggleKey].name) {
              labelElement.textContent = togglesConfig[toggleKey].name;
              labelElement.style.top = togglesConfig[toggleKey].top - 15 + "px";
              labelElement.style.left = togglesConfig[toggleKey].left - 10 + "px";
              labelElement.style.width = "40px";
            }
          }
        });
      }
      function positionKnobs() {
        // Position all knobs based on JSON config
        Object.keys(knobsConfig).forEach((knobKey) => {
          const knobElement = document.getElementById(knobKey);
          const valueElement = document.getElementById(`${knobKey}-value`);
          const labelElement = document.getElementById(`${knobKey}-label`);

          if (knobElement && knobsConfig[knobKey]) {
            knobElement.style.top = knobsConfig[knobKey].top + "px";
            knobElement.style.left = knobsConfig[knobKey].left + "px";

            if (valueElement) {
              valueElement.style.top = knobsConfig[knobKey].top + 42 + "px";
              valueElement.style.left = knobsConfig[knobKey].left + "px";
            }

            if (labelElement && knobsConfig[knobKey].name) {
              labelElement.textContent = knobsConfig[knobKey].name;
              labelElement.style.top = knobsConfig[knobKey].top - 15 + "px";
              labelElement.style.left = knobsConfig[knobKey].left - 10 + "px";
              labelElement.style.width = "55px";
            }
          }
        });
      }

      function toggleBackground() {
        const container = document.getElementById("synth-container");
        const button = document.getElementById("bg-toggle");
        const currentBg = container.style.backgroundImage;

        if (currentBg && currentBg !== "none") {
          container.style.backgroundImage = "none";
          button.textContent = "BG OFF";
          button.classList.add("off");
        } else {
          container.style.backgroundImage = "url('assets/mono-bare.svg')";
          button.textContent = "BG ON";
          button.classList.remove("off");
        }
      }
      class Knob {
        constructor(knobId, options = {}) {
          this.knob = document.querySelector(`#${knobId} .knob-dial`);

          this.maxRot = options.maxRot || 160; // rotation degrees
          this.speed = options.speed || 1.5; // drag sensitivity

          this.currentRot = 0; // initialize at 0
          this.lastRot = 0;

          // bind events
          this.knob.onpointerdown = this.onPointerDown.bind(this);
        }

        onPointerDown(event) {
          this.startY = event.clientY;
          document.addEventListener("pointermove", (this.onPointerMoveBound = this.onPointerMove.bind(this)));
          document.addEventListener("pointerup", (this.onPointerUpBound = this.onPointerUp.bind(this)));
        }

        onPointerMove(event) {
          let delta = this.startY - event.clientY;
          this.currentRot = this.lastRot + delta * this.speed;

          if (this.currentRot > this.maxRot) this.currentRot = this.maxRot;
          if (this.currentRot < -this.maxRot) this.currentRot = -this.maxRot;

          this.knob.style.transform = `rotate(${this.currentRot}deg)`;
        }

        onPointerUp(event) {
          this.lastRot = this.currentRot;
          document.removeEventListener("pointermove", this.onPointerMoveBound);
          document.removeEventListener("pointerup", this.onPointerUpBound);
        }
      }

      // Load configuration and initialize controls
      Promise.all([loadKnobsConfig(), loadTogglesConfig()]).then(() => {
        // Create all knob instances
        Object.keys(knobsConfig).forEach((knobKey) => {
          const knobElement = document.getElementById(knobKey);
          if (knobElement) {
            new Knob(knobKey);
          }
        });

        // Initialize all toggles
        Object.keys(togglesConfig).forEach((toggleKey) => {
          const toggleElement = document.getElementById(toggleKey);
          if (toggleElement && togglesConfig[toggleKey].type === "vertical") {
            const toggleKnob = document.getElementById(`${toggleKey}-knob`);
            const toggleZones = document.querySelectorAll(`#${toggleKey} .vertical-zone`);

            if (toggleKnob && toggleZones.length > 0) {
              toggleZones.forEach((zone) => {
                zone.addEventListener("click", () => {
                  const pos = zone.getAttribute("data-pos");
                  toggleKnob.className = `vertical-knob v-pos-${pos}`;
                  console.log(`${toggleKey} position:`, pos);
                });
              });
            }
          }
        });
      });

      const hKnob = document.getElementById("h-knob");
      const hZones = document.querySelectorAll(".toggle-zone");
      hZones.forEach((zone) => {
        zone.addEventListener("click", () => {
          const pos = zone.getAttribute("data-pos");
          hKnob.className = `toggle-knob pos-${pos}`;
          console.log("Horizontal position:", pos);
        });
      });

      const vKnob = document.getElementById("v-knob");
      const vZones = document.querySelectorAll(".vertical-zone");
      vZones.forEach((zone) => {
        zone.addEventListener("click", () => {
          const pos = zone.getAttribute("data-pos");
          vKnob.className = `vertical-knob v-pos-${pos}`;
          console.log("Vertical position:", pos);
        });
      });
    </script>
  </body>
</html>
