<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korg Monologue Prototype Layout</title>
    <style>
      body {
        margin: 0;
        background: #222;
        font-family: sans-serif;
      }

      /* Global container controls absolute coordinate system */
      #synth-container {
        position: relative;
        width: 900px;
        height: 400px;
        margin: 20px auto;
        background: #f38989;
        border: 2px solid #000000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      /* Background toggle button */
      .bg-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(40, 40, 40, 0.9);
        border: 2px solid #00ffff;
        border-radius: 6px;
        color: #00ffff;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.2s ease;
      }

      .bg-toggle:hover {
        background: rgba(60, 60, 60, 0.9);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      }

      .bg-toggle.off {
        border-color: #666;
        color: #666;
      }
.container {
  position: relative;
  height: 60px; /* enough to fit all vertical offsets */
  width: 700px; /* adjust based on total horizontal spread */
  border: 1px solid #ccc; /* optional, to visualize container */
}

.circle {
  width: 30px;
  height: 30px;
  background-color: blue;
  border-radius: 50%;
  position: absolute; /* allows individual positioning */
}


/* Apply individual top offsets via inline style */
.circle {
  top: 0; /* default fallback */
}
      
    </style>
  <!-- </head> -->
  <body>
    <!-- Background Toggle Button -->
    <button class="bg-toggle" id="bg-toggle" onclick="toggleBackground()">BG ON</button>

    <div
      id="synth-container"
      style="background-image: url('monologue.svg'); background-size: 100% 100%; background-repeat: no-repeat"
    >


<div class="container">
  <div class="circle" style="top: 50px; left: 60px;"></div>
  <div class="circle" style="top: 50px; left: 284px;"></div>
  <div class="circle" style="top: 50px; left: 358px;"></div>
  <div class="circle" style="top: 50px; left: 433px;"></div>
  <div class="circle" style="top: 50px; left: 545px;"></div>
  <div class="circle" style="top: 50px; left: 618px;"></div>
  <div class="circle" style="top: 50px; left: 693px;"></div>
  <div class="circle" style="top: 50px; left: 805px;"></div>


</div>


      <!-- Custom straight lines as requested -->
      <!-- First line: starting at x=11.7, y=7, width=0.2, length=27.7 -->
      <!-- Vertical guide lines -->
      <script>
        function toggleBackground() {
          const container = document.getElementById("synth-container");
          const button = document.getElementById("bg-toggle");
          const currentBg = container.style.backgroundImage;

          if (currentBg && currentBg !== "none") {
            // Turn off background
            container.style.backgroundImage = "none";
            button.textContent = "BG OFF";
            button.classList.add("off");
          } else {
            // Turn on background
            container.style.backgroundImage = "url('monologue.svg')";
            button.textContent = "BG ON";
            button.classList.remove("off");
          }
        }
      </script>
      </div>

 
      </script>
    </div>
  </body>
</html>
