<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korg Monologue Prototype Layout</title>
    <style>
      body {
        margin: 0;
        background: #222;
        font-family: sans-serif;
      }

      /* Global container controls absolute coordinate system */
      #synth-container {
        position: relative;
        width: 900px;
        height: 400px;
        margin: 20px auto;
        background: #f38989;
        border: 2px solid #000000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      .module {
        position: absolute;
        border: 2px solid #000000;
        background: rgba(138, 130, 130, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 14px;
        text-align: center;
        font-weight: bold;
      }

      /* Individual Grid Lines matching SVG coordinates (178x79) */
      .grid-line {
        position: absolute;
        pointer-events: none;
        background-color: rgba(0, 255, 255, 0.8);
        box-shadow: 0 0 2px rgba(0, 255, 255, 0.5);
      }

      /* Vertical lines at SVG coordinate intervals */
      .vertical-line {
        width: 1px;
        height: 100%;
        top: 0;
      }

      /* Horizontal lines at SVG coordinate intervals */
      .horizontal-line {
        width: 100%;
        height: 1px;
        left: 0;
      }

      /* Knob circles */
      .knob-circle {
        position: absolute;
        background-color: rgba(194, 162, 104, 0.3);
        border: 2px solid rgb(31, 24, 11);
        border-radius: 50%;
        pointer-events: none;
        /* Standard knob size - diameter 7 SVG units */
        width: calc(7 / 178 * 100%);
        height: calc(7 / 79 * 100%);
      }

      /* Background toggle button */
      .bg-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(40, 40, 40, 0.9);
        border: 2px solid #00ffff;
        border-radius: 6px;
        color: #00ffff;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.2s ease;
      }

      .bg-toggle:hover {
        background: rgba(60, 60, 60, 0.9);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      }

      .bg-toggle.off {
        border-color: #666;
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- Background Toggle Button -->
    <button class="bg-toggle" id="bg-toggle" onclick="toggleBackground()">BG ON</button>

    <div
      id="synth-container"
      style="background-image: url('monologue.svg'); background-size: 100% 100%; background-repeat: no-repeat"
    >
      <!-- Custom straight lines as requested -->
      <!-- First line: starting at x=11.7, y=7, width=0.2, length=27.7 -->
      <!-- Vertical guide lines -->
      <script>
        // Single utility function to convert SVG coordinates to CSS percentages
        function svgToPercent(coords) {
          const result = {};

          // Handle x coordinate
          if (coords.x !== undefined) {
            result.x = (coords.x / 178) * 100;
          }

          // Handle y coordinate
          if (coords.y !== undefined) {
            result.y = (coords.y / 79) * 100;
          }

          // Handle width
          if (coords.width !== undefined) {
            result.width = (coords.width / 178) * 100;
          }

          // Handle height
          if (coords.height !== undefined) {
            result.height = (coords.height / 79) * 100;
          }

          return result;
        }

        // Reusable function to create vertical guide lines
        function createVerticalLine(x, y, width, length) {
          const line = document.createElement("div");
          const pos = svgToPercent({ x, y, width, height: length });

          line.className = "grid-line";
          line.style.left = `${pos.x}%`;
          line.style.top = `${pos.y}%`;
          line.style.width = `${pos.width}%`;
          line.style.height = `${pos.height}%`;
          line.style.backgroundColor = "rgba(0, 255, 255, 0.8)";
          line.style.boxShadow = "0 0 2px rgba(0, 255, 255, 0.5)";
          return line;
        }

        // X coordinates for vertical lines
        const verticalLineX = [22.7, 37.3, 66.7, 81.3, 95.9, 157.2];
        const container = document.getElementById("synth-container");

        verticalLineX.forEach((x) => {
          container.appendChild(createVerticalLine(x, 7, 0.2, 27.7));
        });

        // Background toggle functionality
        function toggleBackground() {
          const container = document.getElementById("synth-container");
          const button = document.getElementById("bg-toggle");
          const currentBg = container.style.backgroundImage;

          if (currentBg && currentBg !== "none") {
            // Turn off background
            container.style.backgroundImage = "none";
            button.textContent = "BG OFF";
            button.classList.add("off");
          } else {
            // Turn on background
            container.style.backgroundImage = "url('monologue.svg')";
            button.textContent = "BG ON";
            button.classList.remove("off");
          }
        }
      </script>

      <!-- VCO Filter Cutoff Knob Circle -->
      <script>
        // Add VCO Filter Cutoff knob circle
        const synthContainer = document.getElementById("synth-container");
        const cutoffKnob = document.createElement("div");
        cutoffKnob.className = "knob-circle";
        cutoffKnob.id = "knob-vco-filter-cutoff";
        cutoffKnob.title = "VCO Filter Cutoff";

        // Position at SVG coordinates (141.9, 32.7) adjusted for transform (-1.8, -5.1)
        const pos = svgToPercent({ x: 140.1, y: 27.6 });
        const knobSize = svgToPercent({ width: 3.5, height: 3.5 });

        cutoffKnob.style.left = `calc(${pos.x}% - ${knobSize.width}%)`;
        cutoffKnob.style.top = `calc(${pos.y}% - ${knobSize.height}%)`;
        cutoffKnob.style.backgroundColor = "rgba(144, 238, 144, 0.3)";
        cutoffKnob.style.border = "2px solid rgba(34, 139, 34, 0.6)";
        cutoffKnob.style.boxShadow = "0 0 8px rgba(144, 238, 144, 0.4), inset 0 0 4px rgba(255, 255, 255, 0.1)";
        cutoffKnob.style.zIndex = "100";

        synthContainer.appendChild(cutoffKnob);

        // Create wispy green knob circles for all other knobs
        const knobs = [
          { id: "knob-vco-filter-resonance", x: 127.2, y: 32.7, name: "VCO Filter Resonance" },
          { id: "knob-vco-wave", x: 127.2, y: 18, name: "VCO Wave" },
          { id: "knob-vco-pitch", x: 112.6, y: 18, name: "VCO Pitch" },
          { id: "knob-vco-shape", x: 90.6, y: 18, name: "VCO Shape" },
          { id: "knob-filter-eg-intensity", x: 141.9, y: 18, name: "Filter EG Intensity" },
          { id: "knob-lfo-rate", x: 75.9, y: 18, name: "LFO Rate" },
          { id: "knob-lfo-intensity", x: 90.6, y: 32.7, name: "LFO Intensity" },
          { id: "knob-lfo-pitch-intensity", x: 75.9, y: 32.7, name: "LFO Pitch Intensity" },
          { id: "knob-eg-attack", x: 61.2, y: 18, name: "EG Attack" },
          { id: "knob-eg-decay-release", x: 61.2, y: 32.7, name: "EG Decay Release" },
          { id: "knob-drive", x: 17.2, y: 18.2, name: "Drive" },
          { id: "knob-delay-time", x: 17.3, y: 32.8, name: "Delay Time" },
          { id: "knob-delay-feedback", x: 31.7, y: 32.7, name: "Delay Feedback" },
          { id: "knob-master-volume", x: 150.7, y: 42.3, name: "Master Volume", noTransform: true },
          { id: "knob-sync", x: 162.1, y: 12.9, name: "Sync", noTransform: true },
        ];

        knobs.forEach((knobData) => {
          const knob = document.createElement("div");
          knob.className = "knob-circle";
          knob.id = knobData.id;
          knob.title = knobData.name;

          // Apply transform offset (-1.8, -5.1) only for knobs that need it
          const adjustedX = knobData.noTransform ? knobData.x : knobData.x - 1.8;
          const adjustedY = knobData.noTransform ? knobData.y : knobData.y - 5.1;

          const pos = svgToPercent({ x: adjustedX, y: adjustedY });
          const knobSize = svgToPercent({ width: 3.5, height: 3.5 });

          knob.style.left = `calc(${pos.x}% - ${knobSize.width}%)`;
          knob.style.top = `calc(${pos.y}% - ${knobSize.height}%)`;
          knob.style.backgroundColor = "rgba(144, 238, 144, 0.3)";
          knob.style.border = "2px solid rgba(34, 139, 34, 0.6)";
          knob.style.boxShadow = "0 0 8px rgba(144, 238, 144, 0.4), inset 0 0 4px rgba(255, 255, 255, 0.1)";
          knob.style.zIndex = "100";

          synthContainer.appendChild(knob);
        });
      </script>
    </div>

    <script>
      // Load knobs JSON and create circles
      fetch("drive.json")
        .then((response) => response.json())
        .then((knobs) => {
          const container = document.getElementById("synth-container");

          knobs.forEach((knob) => {
            // Create circle element
            const circle = document.createElement("div");
            circle.className = "knob-circle";
            circle.id = knob.name;

            // Convert SVG coordinates to percentages
            const pos = svgToPercent({ x: knob.x, y: knob.y });
            const knobSize = svgToPercent({ width: 7, height: 3.5 });

            // Center the circle on the knob position (subtract half diameter)
            circle.style.left = `calc(${pos.x}% - ${knobSize.width}%)`;
            circle.style.top = `calc(${pos.y}% - ${knobSize.height}%)`;

            // Special styling for drive knob - mark with grey color
            if (knob.name === "knob-drive") {
              circle.style.backgroundColor = "rgba(128, 128, 128, 0.8)";
              circle.style.border = "2px solid rgb(64, 64, 64)";
            }

            // Add tooltip with knob name
            circle.title = knob.name.replace("knob-", "").replace(/-/g, " ");

            container.appendChild(circle);
          });
        })
        .catch((error) => {
          console.error("Error loading knobs:", error);
        });
    </script>
  </body>
</html>
