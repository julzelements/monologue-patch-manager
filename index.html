<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korg Monologue Prototype Layout</title>
    <style>
      body {
        margin: 0;
        background: #222;
        font-family: sans-serif;
      }

      /* Global container controls absolute coordinate system */
      #synth-container {
        position: relative;
        width: 900px;
        height: 400px;
        margin: 20px auto;
        background: #f38989;
        border: 2px solid #000000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      /* Background toggle button */
      .bg-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(40, 40, 40, 0.9);
        border: 2px solid #00ffff;
        border-radius: 6px;
        color: #00ffff;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.2s ease;
      }

      .bg-toggle:hover {
        background: rgba(60, 60, 60, 0.9);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      }

      .bg-toggle.off {
        border-color: #666;
        color: #666;
      }

      .container {
        position: relative;
        height: 60px;
        width: 700px;
        border: 1px solid #ccc;
      }

      .circle {
        width: 37px;
        height: 37px;
        background-color: blue;
        border-radius: 50%;
        position: absolute;
        opacity: 50%;
        top: 0;
        pointer-events: none; /* Allow clicks to pass through to knobs underneath */
      }

      .pill {
        width: 21px;
        height: 52px;
        background-color: #00ffff;
        border-radius: 10px;
        position: absolute;
      }

      .divider {
        position: absolute;
        width: 1px;
        height: 140px;
        background-color: #78e484;
        top: 50px;
        left: 450px;
      }

      .ruler {
        position: absolute;
        width: 20px;
        height: 20px;
        top: 282px;
        left: 246px;
        background-color: #78e484;
      }

      .lcd-screen {
        position: absolute;
        width: 71px;
        height: 41px;
        top: 192px;
        left: 635px;
        border: 1px solid #333;
        background-color: #333;
        border-radius: 2px;
      }

      .sequencer-container {
        display: grid;
        grid-template-columns: repeat(16, 32px);
        gap: 5.2px;
        position: absolute;
        left: 246px;
        top: 282px;
      }

      .edit-menu-container {
        display: grid;
        grid-template-columns: repeat(3, 32px);
        gap: 5px;
        position: absolute;
        left: 320px;
        top: 206px;
      }

      .sequencer-menu-container {
        display: grid;
        grid-template-columns: repeat(4, 32px);
        gap: 5px;
        position: absolute;
        left: 469px;
        top: 206px;
      }

      .menu-button {
        height: 15px;
        width: 32px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
        border-radius: 2px;
      }

      .square {
        width: 32px;
        height: 30px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
      }

      .key-trig-hold {
        position: absolute;
        top: 123px;
        left: 804px;
        width: 32px;
        height: 30px;
        background-color: rgb(82, 150, 173);
        border: 1px solid #333;
      }

      .u-path {
        stroke: blue;
        stroke-width: 1;
        fill: none;
      }

      .knob {
        width: 37px;
        height: 37px;
        position: absolute;
        top: 100px;
        left: 100px;
      }

      .knob-dial {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #444;
        border: 2px solid #222; /* scaled down border */
        position: relative;
        display: flex;
        justify-content: center;
        transform-origin: center center;
        align-items: center;
        touch-action: none; /* ensures smooth dragging */
      }

      .knob-pointer {
        width: 3px;
        height: 15px;
        background: #ffcc00;
        border-radius: 2px;
        position: absolute;
        top: 3px;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>

  <body>

      <svg width="100%" height="100%" viewBox="0 0 900 300">

    <script>
      function toggleBackground() {
        const container = document.getElementById("synth-container");
        const button = document.getElementById("bg-toggle");
        const currentBg = container.style.backgroundImage;

        if (currentBg && currentBg !== "none") {
          container.style.backgroundImage = "none";
          button.textContent = "BG OFF";
          button.classList.add("off");
        } else {
          container.style.backgroundImage = "url('monologue.svg')";
          button.textContent = "BG ON";
          button.classList.remove("off");
        }
      }
      class SimpleKnob {
        constructor(knobId, displayId, options = {}) {
          this.knob = document.querySelector(`#${knobId} .knob-dial`);
          this.display = document.getElementById(displayId);

          this.maxRot = options.maxRot || 160; // rotation degrees
          this.speed = options.speed || 1.5; // drag sensitivity

          this.currentRot = 0; // initialize at 0
          this.lastRot = 0;

          // initialize display
          this.updateDisplay();

          // bind events
          this.knob.onpointerdown = this.onPointerDown.bind(this);
        }

        onPointerDown(event) {
          this.startY = event.clientY;
          document.addEventListener("pointermove", (this.onPointerMoveBound = this.onPointerMove.bind(this)));
          document.addEventListener("pointerup", (this.onPointerUpBound = this.onPointerUp.bind(this)));
        }

        onPointerMove(event) {
          let delta = this.startY - event.clientY;
          this.currentRot = this.lastRot + delta * this.speed;

          if (this.currentRot > this.maxRot) this.currentRot = this.maxRot;
          if (this.currentRot < -this.maxRot) this.currentRot = -this.maxRot;

          this.knob.style.transform = `rotate(${this.currentRot}deg)`;
          this.updateDisplay();
        }

        onPointerUp(event) {
          this.lastRot = this.currentRot;
          document.removeEventListener("pointermove", this.onPointerMoveBound);
          document.removeEventListener("pointerup", this.onPointerUpBound);
        }

        // map rotation (-maxRot to +maxRot) to 0–1023
        updateDisplay() {
          let value = Math.round(((this.currentRot + this.maxRot) / (this.maxRot * 2)) * 1023);
          value = Math.min(Math.max(value, 0), 1023);
          this.display.textContent = `Value: ${value}`;
        }
      }

      const masterKnob = new SimpleKnob("master", "master-value");
      const vco2PitchKnob = new SimpleKnob("vco2Pitch", "vco2Pitch-value");
    </script>
